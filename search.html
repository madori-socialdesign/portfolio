<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search｜Kota</title>

  <script src="./js/jquery-3.7.0.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.10.0/css/lightbox.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.10.0/js/lightbox.min.js"></script>

  <link href="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/main.css" />

  <script src="./js/script.js"></script>
</head>

<body>
  <div id="js-mouse-stalker" class="c-mouse-stalker"></div>

  <header class="l-header">
    <div class="l-header__inner">
      
      <h1 class="l-header__logo">
        <a href="index.html">
          <span class="l-header__logo-main">窓鳥</span>
          <span class="l-header__logo-sub">MADORI</span>
        </a>
      </h1>

      <nav class="p-global-nav" aria-label="メインナビゲーション">
        <ul class="p-global-nav__pc-list">
          <li><a href="about.html" class="is-current">ABOUT</a></li>
          <li><a href="works.html">WORKS</a></li>
          <li><a href="photo.html">PHOTO</a></li>
          <li>
            <a href="https://www.instagram.com/054kotak054/" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-instagram" aria-label="Instagram"></i>
            </a>
          </li>
<!-- ナビゲーション内の検索フォーム -->
          <li class="p-global-nav__search">
            <!-- action に検索結果ページのURL（またはファイル名）を指定 -->
            <form class="search-form" action="search.html" method="get">
              <!-- name="q" はそのまま（Google検索のデフォルトクエリ名） -->
              <input type="text" name="q" class="search-input" placeholder="Search..." required>
              <button type="submit" class="search-button">
                <i class="fas fa-search" aria-label="検索"></i>
              </button>
            </form>
          </li>
        </ul>

        <div id="js-sp-menu" class="p-global-nav__sp-wrapper">
          <ul class="p-global-nav__sp-list">
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="works.html">WORKS</a></li>
            <li><a href="photo.html">PHOTO</a></li>
            <li>
              <a href="https://www.instagram.com/054kotak054/" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram" aria-label="Instagram"></i>
              </a>
            </li>
            <!-- ナビゲーション内の検索フォーム -->
            <li class="p-global-nav__search">
              <!-- action に検索結果ページのURL（またはファイル名）を指定 -->
              <form class="search-form" action="search.html" method="get">
                <!-- name="q" はそのまま（Google検索のデフォルトクエリ名） -->
                <input type="text" name="q" class="search-input" placeholder="Search..." required>
                <button type="submit" class="search-button">
                  <i class="fas fa-search" aria-label="検索"></i>
                </button>
              </form>
            </li>
          </ul>
        </div>
      </nav>

      <button type="button" id="js-hamburger" class="p-hamburger" aria-controls="js-sp-menu" aria-expanded="false" aria-label="メニューを開閉する">
        <span class="p-hamburger__line"></span>
        <span class="p-hamburger__line"></span>
        <span class="p-hamburger__line"></span>
      </button>

    </div>
  </header>

<!-- search.html のメインコンテンツ部分の例 -->
    <main class="l-main">
    <!-- l-container を付与して幅を統一する -->
    <div class="p-index-container l-container" style="margin-top: 150px; margin-bottom: 150px;">
        <h3>Search Results</h3>
        
        <!-- 取得したGoogleのスクリプト -->
        <script async src="https://cse.google.com/cse.js?cx=あなたの検索エンジンID"></script>
        <!-- 検索結果の表示エリア -->
        <div class="gcse-searchresults-only"></div>
    </div>
    </main>
  </body>
</html>
